services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_day
      POSTGRES_USER: ai_day
      POSTGRES_PASSWORD: ai_day
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_day -d ai_day"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://ai_day:ai_day@postgres:5432/ai_day?sslmode=disable
      AUTH_MODE: phone
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  minio_data:
